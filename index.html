<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Subjects, topics and notes. Local-first, quiet, tidy." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231c1c1e'/%3E%3Cpath d='M19 19h26v6H25v14h18v6H19z' fill='%23f6f6f7'/%3E%3C/svg%3E" />
    <title>Notes</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong colours.
      try {
        var s = JSON.parse(localStorage.getItem('notes.settings.v1') || '{}')
        var dark = s.theme === 'dark' || ((s.theme == null || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Notes needs JavaScript. Everything still stays on your device.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
